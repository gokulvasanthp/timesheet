spring:
  application:
    name: timesheet
    
  datasource:
    url: jdbc:postgresql://127.0.0.1:55432/appdb
    username: appuser
    password: secret123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000
      data-source-properties:
        TimeZone: Asia/Kolkata
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  sql:
    init:
      mode: always

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

logging:
  level:
    "org.springframework.jdbc.datasource": DEBUG
